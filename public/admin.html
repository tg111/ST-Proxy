<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ST Proxy</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>

  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h1 class="login-title">ST Proxy</h1>
      <p class="login-sub">管理后台</p>
      <form id="loginForm" class="login-form">
        <input id="loginKey" type="password" placeholder="输入 API Key" autocomplete="current-password" required>
        <button type="submit">登录</button>
      </form>
      <p class="login-hint">SillyTavern 调用反代时也使用同一个 Bearer API key。</p>
    </div>
  </div>

  <div id="appLayout" class="hidden">

    <header class="topbar">
      <div class="topbar-brand">
        <h1>ST Proxy</h1>
        <p>渠道管理、模型别名和使用记录</p>
      </div>
      <div class="topbar-actions">
        <a class="icon-btn" href="https://github.com/tg111/ST-Proxy" target="_blank" rel="noreferrer" aria-label="GitHub" title="GitHub">
          <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.02c-3.2.69-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.17 1.18.92-.26 1.9-.38 2.88-.39.98.01 1.96.13 2.88.39 2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.24 2.75.12 3.04.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"></path>
          </svg>
        </a>
        <button id="logoutBtn" type="button" class="btn ghost">退出</button>
      </div>
    </header>

    <div class="content-wrap">

      <div class="info-card">
        <div class="endpoint-row">
          <span class="endpoint-label">Base URL</span>
          <code id="baseUrl" class="endpoint-val"></code>
        </div>
        <div class="endpoint-row">
          <span class="endpoint-label">Models</span>
          <code class="endpoint-val">/v1/models</code>
        </div>
        <div class="endpoint-row">
          <span class="endpoint-label">Chat</span>
          <code class="endpoint-val">/v1/chat/completions</code>
        </div>
        <p class="info-hint">在 SillyTavern 中选择 OpenAI 兼容接口，API Key 填本后台登录 key。</p>
      </div>

      <section class="section">
        <div class="section-header">
          <h3>渠道管理</h3>
          <div class="header-actions">
            <button id="refreshBtn" type="button" class="btn ghost">刷新</button>
            <button id="addChannelBtn" type="button" class="btn primary">添加渠道</button>
          </div>
        </div>
        <div id="channels" class="channel-list"></div>
      </section>

      <section class="section">
        <div class="section-header">
          <h3>使用记录</h3>
          <div class="header-actions">
            <select id="usageStatusFilter" class="input-sm">
              <option value="all">全部</option>
              <option value="success">仅成功</option>
              <option value="failed">仅失败</option>
            </select>
            <button id="usageBtn" type="button" class="btn ghost">刷新</button>
            <button id="clearUsageBtn" type="button" class="btn danger">清空记录</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>状态</th>
                <th>模型</th>
                <th>源模型</th>
                <th>渠道</th>
                <th>错误</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="usageRows"></tbody>
          </table>
        </div>
      </section>

    </div>
  </div>

  <div id="addModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3>添加渠道</h3>
        <button id="addCloseBtn" type="button" class="icon-btn">&#x2715;</button>
      </div>
      <form id="channelForm" class="form-stack">
        <label class="field">
          <span>API 地址 <em class="required-tag">必填</em></span>
          <input name="apiBase" placeholder="https://api.openai.com 或 https://api.anthropic.com" required>
        </label>
        <label class="field">
          <span>密钥</span>
          <input name="apiKey" type="password">
        </label>
        <label class="field">
          <span>备注</span>
          <input name="note" placeholder="OpenAI 主账号、Claude 备用等">
        </label>
        <label class="field">
          <span>服务商链接</span>
          <input name="providerLink" placeholder="https://example.com">
        </label>
        <label class="field">
          <span>格式</span>
          <select name="providerType">
            <option value="auto">自动识别</option>
            <option value="openai">OpenAI 兼容</option>
            <option value="anthropic">Claude / Anthropic</option>
            <option value="gemini">Gemini</option>
          </select>
        </label>
        <label class="field">
          <span>渠道传输</span>
          <select name="stream">
            <option value="true">流式</option>
            <option value="false">非流式</option>
          </select>
        </label>
        <fieldset class="field fieldset">
          <legend>参数透传</legend>
          <div class="check-grid">
            <label><input type="checkbox" name="pass_temperature" checked> temperature</label>
            <label><input type="checkbox" name="pass_top_p" checked> top_p</label>
            <label><input type="checkbox" name="pass_top_k" checked> top_k</label>
            <label><input type="checkbox" name="pass_frequency_penalty" checked> frequency_penalty</label>
            <label><input type="checkbox" name="pass_presence_penalty" checked> presence_penalty</label>
          </div>
        </fieldset>
        <div class="form-actions">
          <button type="button" class="btn ghost" id="addCancelBtn">取消</button>
          <button type="submit" class="btn primary">保存渠道</button>
        </div>
      </form>
    </div>
  </div>

  <div id="editModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="editTitle">编辑渠道</h3>
        <button id="editCloseBtn" type="button" class="icon-btn">&#x2715;</button>
      </div>
      <form id="editForm" class="form-stack">
        <input name="id" type="hidden">
        <label class="field">
          <span>API 地址 <em class="required-tag">必填</em></span>
          <input name="apiBase" required>
        </label>
        <label class="field">
          <span>密钥</span>
          <input name="apiKey" type="text" autocomplete="off">
        </label>
        <label class="field">
          <span>备注</span>
          <input name="note">
        </label>
        <label class="field">
          <span>服务商链接</span>
          <input name="providerLink">
        </label>
        <label class="field">
          <span>格式</span>
          <select name="providerType">
            <option value="auto">自动识别</option>
            <option value="openai">OpenAI 兼容</option>
            <option value="anthropic">Claude / Anthropic</option>
            <option value="gemini">Gemini</option>
          </select>
        </label>
        <label class="field">
          <span>渠道传输</span>
          <select name="stream">
            <option value="true">流式</option>
            <option value="false">非流式</option>
          </select>
        </label>
        <fieldset class="field fieldset">
          <legend>参数透传</legend>
          <div class="check-grid">
            <label><input type="checkbox" name="pass_temperature"> temperature</label>
            <label><input type="checkbox" name="pass_top_p"> top_p</label>
            <label><input type="checkbox" name="pass_top_k"> top_k</label>
            <label><input type="checkbox" name="pass_frequency_penalty"> frequency_penalty</label>
            <label><input type="checkbox" name="pass_presence_penalty"> presence_penalty</label>
          </div>
        </fieldset>
        <div class="form-actions">
          <button type="button" class="btn ghost" id="editCancelBtn">取消</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/assets/app.js"></script>
</body>
</html>
